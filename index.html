<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MoviCult - Stream movies and TV shows with reliable multi-provider playback."
    />
    <title>MoviCult</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <button class="brand" id="brandButton" aria-label="MoviCult home">
          <img class="brand-logo" src="logo.png" alt="MoviCult logo" />
          <span class="brand-name">MoviCult</span>
        </button>

        <nav class="site-nav" id="siteNav">
          <button class="nav-link is-active" data-view="home">Home</button>
          <button class="nav-link" data-view="movies">Movies</button>
          <button class="nav-link" data-view="series">TV Shows</button>
        </nav>

        <div class="search-wrap">
          <i class="fas fa-magnifying-glass search-icon"></i>
          <input
            type="search"
            id="searchInput"
            class="search-input"
            placeholder="Search movies & TV..."
            autocomplete="off"
            spellcheck="false"
          />
          <button
            class="search-clear"
            id="searchClear"
            aria-label="Clear search"
          >
            <i class="fas fa-xmark"></i>
          </button>
        </div>
      </div>
    </header>

    <main id="viewRoot" class="view-root"></main>

    <div id="scrollSentinel" class="scroll-sentinel"></div>

    <div class="toast" id="toast" hidden></div>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="player.js"></script>
    <script src="views.js"></script>
    <script src="app.js"></script>
  </body>
</html>
